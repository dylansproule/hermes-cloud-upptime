owner: dylansproule
repo: hermes-cloud-upptime

sites:
  - name: Hosted Cloud
    url: https://www.hostedhermes.com

status-website:
  cname: ://hostedhermes.com
  baseUrl: ""
  name: "System Status"
  introTitle: "Operational Status & Metrics"
  logoUrl: https://hostedhermes.com/_next/image?url=%2Flogo.png&w=96&q=75
  navbar:
    - title: Status
      href: /

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration

customCSS: |
  /* Base reset to sharp, modern sans UI elements */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif !important;
    background-color: #f3f4f6 !important;
    color: #1f2937 !important;
  }
  
  /* Make status page panels flat cards with crisp border definitions */
  .card {
    background: #ffffff !important;
    border: 1px solid #e5e7eb !important;
    border-radius: 4px !important;
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05) !important;
    padding: 20px !important;
    margin-bottom: 12px !important;
  }

  /* Force headers indicating category section blocks to stretch full width */
  h3, .category-header {
    font-size: 0.85rem !important;
    text-transform: uppercase !important;
    letter-spacing: 0.05em !important;
    color: #6b7280 !important;
    border-bottom: 1px dashed #e5e7eb !important;
    padding-bottom: 6px !important;
    margin-top: 24px !important;
  }

  /* Main top hero layout bar */
  .status-bar {
    border-radius: 4px !important;
    padding: 18px 24px !important;
    font-weight: 600 !important;
    font-size: 1.15rem !important;
    letter-spacing: -0.01em !important;
  }

  /* Pure OpenAI Emerald palette override for Operational systems */
  .status-up, .all-systems-operational {
    background-color: #10b981 !important; 
    color: #ffffff !important;
  }

  /* Warning / Partial Outage styling overrides */
  .status-degraded, .partial-outage {
    background-color: #f59e0b !important;
    color: #ffffff !important;
  }

  /* Critical Outage styling overrides */
  .status-down, .major-outage {
    background-color: #ef4444 !important;
    color: #ffffff !important;
  }

  /* Flatten timeline graphic components */
  .uptime-line {
    border-radius: 1px !important;
    height: 24px !important;
    gap: 2px !important;
  }

  /* Replace the latency silhouette with operational availability ticks. */
  .live-status article.graph {
    --background: repeating-linear-gradient(
      90deg,
      #10a37f 0 3px,
      transparent 3px 7px
    ) !important;
    background-size: 44% 44px !important;
    background-position: right 2rem center !important;
  }

  @media (max-width: 700px) {
    .live-status article.graph {
      background-size: calc(100% - 2rem) 36px !important;
      background-position: center bottom 1rem !important;
      padding-bottom: 4.5rem !important;
    }
  }

  /* Remove the default Upptime attribution footer. */
  footer {
    display: none !important;
  }
